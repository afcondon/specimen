workspace:
  packageSet:
    registry: 77.13.1
  extraPackages:
    hylograph-layout: "0.3.0"
    halogen-widgets: "0.2.0"

package:
  name: specimen
  description: "Typesets a PureScript module as a printed-quality specimen — block classification, alignment passes, ornament layer, rendered as Halogen HTML."
  dependencies:
    - aff
    - aff-promise
    - arrays
    - console
    - effect
    - either
    - exceptions
    - foldable-traversable
    - halogen
    - halogen-vdom-string-renderer
    - language-cst-parser
    - maybe
    - nullable
    - ordered-collections
    - prelude
    - strings
    - tuples
    - web-dom
    - web-html
  test:
    main: Test.Main
    dependencies:
      - node-fs
      - node-process
      - spec
      - spec-node
  bundle:
    module: Specimen.Main
    outfile: public/bundle.js
    platform: browser
