package:
  name: specimen-site
  description: "Builds a typeset specimen book for a PureScript package: harvest, layout, and page assembly, all as pure PureScript."
  dependencies:
    - aff
    - aff-promise
    - arrays
    - console
    - effect
    - foldable-traversable
    - halogen
    - halogen-vdom-string-renderer
    - hylograph-layout
    - integers
    - maybe
    - node-buffer
    - node-fs
    - node-path
    - node-process
    - numbers
    - ordered-collections
    - prelude
    - specimen
    - st
    - strings
    - tuples
  bundle:
    module: Specimen.Site.Main
    outfile: ../cli/specimen-site.js
    platform: node
  test:
    main: Test.Site.Main
    dependencies:
      - spec
      - spec-node
